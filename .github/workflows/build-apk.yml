name: Build ShortsGuard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: cp app/build/outputs/apk/debug/app-debug.apk ShortsGuard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortsGuard-Debug-APK
          path: ShortsGuard.apk

      - name: Create Permanent Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ShortsGuard v1.0.0
          body: |
            ## 🛡️ ShortsGuard v1.0.0
            Download **ShortsGuard.apk** directly below and install on your phone!
            
            ### Features:
            - 🚫 Completely blocks YouTube Shorts
            - 🛡️ Visually masks & hides the bottom Shorts button
            - ⏱️ Unbreakable focus countdown deadline mode
            - 🌐 Blocks Chrome reels & WhatsApp status
          files: ShortsGuard.apk
